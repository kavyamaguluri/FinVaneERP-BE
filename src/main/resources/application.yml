server:
  port: ${PORT:8080}

spring:
  application:
    name: finvane-backend
  profiles:
    active: dev

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_CONTROL_NAME:finvane_control}?createDatabaseIfNotExist=true&useSSL=${DB_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
    username: ${DB_USER:root}
    password: ${DB_PASS:root_FinVane}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: FinVaneControlPool
      maximum-pool-size: 10
      minimum-idle: 3
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 50MB

app:
  jwt:
    secret: ${JWT_SECRET:finvane_jwt_secret_key_2026_super_secure_enterprise_key_min_256_bits!}
    expiration-ms: 86400000 # 24 hours
  multitenancy:
    schema-prefix: finvane_entity_
    default-tenant: "1"
  mail:
    from: ${MAIL_FROM:noreply@finvane.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  file:
    name: logs/finvane-api.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level - %msg%n"
  level:
    root: INFO
    com.finvane: INFO
    com.finvane.config.ApiLoggingFilter: INFO

